<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OKR Party — Q3 Team Compliance</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  body { font-family: 'Nunito', 'Segoe UI', system-ui, sans-serif; background: #FAF7F2; color: #2E2440; }
  @keyframes op-fade { from { opacity:0; transform: translateY(6px);} to { opacity:1; transform:none; } }
  .op-fade { animation: op-fade .34s cubic-bezier(.2,.7,.3,1) both; }
  .op-card { transition: transform .18s ease, box-shadow .18s ease; }
  .op-card:hover { transform: translateY(-2px); }
  /* long unbroken text must never blow out the card */
  .wrap-any { overflow-wrap: anywhere; word-break: break-word; }
  @media (prefers-reduced-motion: reduce){ .op-fade{animation:none;} .op-card{transition:none;} }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useCallback } = React;

// ============================================================
//  PASTE YOUR APPS SCRIPT WEB APP URL HERE  (ends with /exec)
// ============================================================
const API_URL = "https://script.google.com/macros/s/AKfycbyCpLh6CL-mL3pG9AgdSaRlqNiAIXuqNMwWDWJjcSHKBiPP0gVJWpoVpngB0dUmzEzu/exec";

const EMOJIS = ["🦊","🐙","🐝","🦄","🐼","🦋","🐧","🦜","🐢","🦩","🦖","🐨","🐬","🦔","🐌","🦉"];
const PALETTE = ["#FF6F61","#FFB347","#FFD166","#6FCF97","#5FB4E5","#9B8CFF","#FF8FB1","#4DD0C4"];
const CLUSTER_COLORS = ["#FFE0DA","#FFF1D6","#E4F7E9","#DCEEFB","#EEE9FF","#FFE3ED","#DBF7F3","#F1EAD8"];
const REACTIONS = ["🔥","👍","😂","😍","🤔","👎"];
const CORAL = "#FF6F61";
const SHADOW = "0 6px 24px rgba(46,36,64,0.07)";
const SHADOW_SM = "0 2px 10px rgba(46,36,64,0.05)";
const uid = () => Math.random().toString(36).slice(2, 10);

// ---------- api ----------
// text/plain avoids a CORS preflight, which Apps Script does not answer.
async function api(action, payload) {
  const res = await fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ action, payload: payload || {} }),
  });
  return res.json();
}

// ---------- root ----------
function App() {
  const [me, setMe] = useState(null);
  const [data, setData] = useState(null);
  const [err, setErr] = useState(null);
  const busy = useRef(false);

  const refresh = useCallback(async () => {
    if (busy.current) return;
    busy.current = true;
    try {
      const d = await api("getAll");
      if (d && d.ok) { setData(d); setErr(null); }
    } catch (e) { setErr("Сервертэй холбогдож чадсангүй"); }
    busy.current = false;
  }, []);

  useEffect(() => {
    const saved = localStorage.getItem("okrparty_me");
    if (saved) { try { setMe(JSON.parse(saved)); } catch {} }
    refresh();
    const t = setInterval(refresh, 3000);
    return () => clearInterval(t);
  }, [refresh]);

  // send an action, apply an instant local guess, then reconcile with the server
  const send = useCallback(async (action, payload, optimistic) => {
    if (optimistic) setData(d => (d ? optimistic(d) : d));
    try { const d = await api(action, payload); if (d && d.ok) setData(d); }
    catch (e) { setErr("Хадгалахад алдаа гарлаа — дахин оролдоно уу"); }
  }, []);

  const join = async (p) => {
    setMe(p);
    localStorage.setItem("okrparty_me", JSON.stringify(p));
    await send("join", p, d => ({ ...d, participants: [...d.participants, p] }));
  };

  if (API_URL.indexOf("PASTE_YOUR") === 0) return <SetupNotice/>;
  if (!data) return <Splash text={err || "Ачаалж байна..."}/>;
  if (!me) return <JoinScreen onJoined={join}/>;

  return <MainApp me={me} data={data} send={send} refresh={refresh} err={err}
    onSwitchIdentity={() => { localStorage.removeItem("okrparty_me"); setMe(null); }}/>;
}

function Splash({ text }) {
  return <div className="min-h-screen flex items-center justify-center text-[#B0A6C0] font-bold">{text}</div>;
}

function SetupNotice() {
  return (
    <div className="min-h-screen flex items-center justify-center px-4">
      <div className="max-w-md bg-white rounded-3xl border border-[#F0EAE0] p-8 text-center" style={{ boxShadow: SHADOW }}>
        <div className="text-4xl mb-3">⚙️</div>
        <h1 className="font-extrabold text-lg mb-2">Тохиргоо дутуу байна</h1>
        <p className="text-sm text-[#7A6F8A]">
          <code className="bg-[#FAF7F2] px-1 rounded">index.html</code> файл доторх <b>API_URL</b> хэсэгт
          Google Apps Script-ийн web app хаягаа (…/exec) оруулна уу.
        </p>
      </div>
    </div>
  );
}

// ---------- join ----------
function JoinScreen({ onJoined }) {
  const [name, setName] = useState("");
  const [emoji, setEmoji] = useState(EMOJIS[0]);
  const [color, setColor] = useState(PALETTE[0]);
  const [traits, setTraits] = useState(["", "", ""]);
  const [busy, setBusy] = useState(false);
  const canJoin = name.trim() && traits.some(t => t.trim());

  const submit = async () => {
    setBusy(true);
    await onJoined({
      id: uid(), name: name.trim(), emoji, color,
      traits: traits.map(t => t.trim()).filter(Boolean), joinedAt: Date.now(),
    });
    setBusy(false);
  };

  return (
    <div className="min-h-screen flex items-center justify-center px-4 py-10">
      <div className="w-full max-w-md op-fade">
        <div className="text-center mb-6">
          <div className="inline-flex items-center gap-2 text-[#FF6F61] font-extrabold text-3xl">🎉 OKR Party</div>
          <p className="text-[#7A6F8A] font-bold mt-0.5">Q3 · Team Compliance</p>
          <p className="text-[#9E93B0] mt-2 text-sm">Хамтдаа — өөрийгөө таниулж, санаагаа хуваалцаарай</p>
        </div>
        <div className="bg-white rounded-[28px] p-6 space-y-5 border border-[#F0EAE0]" style={{ boxShadow: SHADOW }}>
          <div>
            <label className="text-xs font-bold uppercase tracking-wide text-[#B0A6C0]">Таны нэр</label>
            <input value={name} onChange={e => setName(e.target.value)} placeholder="жишээ нь: Энхтуяа"
              className="mt-1.5 w-full rounded-2xl border-2 border-[#F0EAE0] px-4 py-2.5 outline-none focus:border-[#FF6F61] text-[15px]"/>
          </div>
          <div>
            <label className="text-xs font-bold uppercase tracking-wide text-[#B0A6C0]">Аватараа сонго</label>
            <div className="mt-2 flex items-center gap-3">
              <div className="w-16 h-16 rounded-full flex items-center justify-center text-3xl shrink-0"
                style={{ background: color + "22", border: `3px solid ${color}` }}>{emoji}</div>
              <div className="grid grid-cols-8 gap-1 flex-1">
                {EMOJIS.map(e => (
                  <button key={e} onClick={() => setEmoji(e)}
                    className={`text-lg rounded-lg py-1 ${emoji === e ? "bg-[#FFF1EE] ring-2 ring-[#FF6F61]" : "hover:bg-[#FAF7F2]"}`}>{e}</button>
                ))}
              </div>
            </div>
            <div className="mt-3 flex gap-2">
              {PALETTE.map(c => (
                <button key={c} onClick={() => setColor(c)} className="w-6 h-6 rounded-full hover:scale-110 transition"
                  style={{ background: c, boxShadow: color === c ? `0 0 0 2px white, 0 0 0 4px ${c}` : "none" }}/>
              ))}
            </div>
          </div>
          <div>
            <label className="text-xs font-bold uppercase tracking-wide text-[#B0A6C0]">Өөрийнхөө тухай сонирхолтой мэдээлэл</label>
            <p className="text-[11px] text-[#B0A6C0] mb-1.5">Бусад оролцогчид "Хэн бэ?" тоглоомд эдгээрээр таныг таамаглана — хөгжилтэй зүйлс бичээрэй!</p>
            <div className="space-y-2">
              {traits.map((t, i) => (
                <input key={i} value={t} onChange={e => { const cp=[...traits]; cp[i]=e.target.value; setTraits(cp); }}
                  placeholder={["жишээ нь: цайгүй бол ажилладаггүй","жишээ нь: нууцхан сайхан дуулдаг","жишээ нь: даваа гарагийг үзэн яддаг"][i]}
                  className="w-full rounded-xl border-2 border-[#F0EAE0] px-3 py-2 text-sm outline-none focus:border-[#FF6F61]"/>
              ))}
            </div>
          </div>
          <button disabled={!canJoin || busy} onClick={submit}
            className="w-full rounded-2xl py-3 font-bold text-white disabled:opacity-40 hover:brightness-105 active:scale-[.99] transition"
            style={{ background: CORAL, boxShadow: `0 6px 18px ${CORAL}44` }}>
            {busy ? "Нэгдэж байна..." : "Нэгдэх →"}
          </button>
        </div>
      </div>
    </div>
  );
}

// ---------- shell ----------
function MainApp({ me, data, send, onSwitchIdentity, err }) {
  const [tab, setTab] = useState("guess");
  const tabs = [
    { id: "guess", label: "Би хэн бэ?", icon: "🕵️" },
    { id: "ideas", label: "Асуудлууд", icon: "✨" },
    { id: "board", label: "Cluster field", icon: "🗂️" },
    { id: "okr", label: "OKR", icon: "🎯" },
    { id: "poll", label: "Дайралцаан", icon: "👍" },
    { id: "export", label: "Үр дүн татах", icon: "📊" },
  ];

  return (
    <div className="max-w-5xl mx-auto px-4 pb-16">
      <div className="flex items-center justify-between pt-6 pb-1 gap-3">
        <div>
          <div className="flex items-center gap-2 font-extrabold text-2xl text-[#FF6F61] leading-none">🎉 OKR Party</div>
          <p className="text-[#B0A6C0] font-bold text-xs mt-1">Q3 · Team Compliance · {data.participants.length} хүн</p>
        </div>
        <button onClick={onSwitchIdentity}
          className="flex items-center gap-2 bg-white rounded-full pl-1 pr-3 py-1 border border-[#F0EAE0] text-sm shrink-0" style={{ boxShadow: SHADOW_SM }}>
          <span className="w-7 h-7 rounded-full flex items-center justify-center text-base" style={{ background: me.color + "22" }}>{me.emoji}</span>
          <span className="max-w-[100px] truncate">{me.name}</span>
        </button>
      </div>

      {err && <div className="bg-[#FFE3DA] text-[#C6503D] text-xs font-bold rounded-xl px-3 py-2 mb-2">{err}</div>}

      <div className="flex gap-1 bg-white border border-[#F0EAE0] p-1.5 rounded-[18px] my-5 overflow-x-auto" style={{ boxShadow: SHADOW_SM }}>
        {tabs.map(t => (
          <button key={t.id} onClick={() => setTab(t.id)}
            className={`flex items-center gap-1.5 px-4 py-2 rounded-[13px] text-sm font-bold whitespace-nowrap transition-all ${tab === t.id ? "text-white" : "text-[#7A6F8A] hover:bg-[#FAF7F2]"}`}
            style={tab === t.id ? { background: CORAL, boxShadow: `0 4px 12px ${CORAL}40` } : {}}>
            <span>{t.icon}</span> {t.label}
          </button>
        ))}
      </div>

      <div key={tab} className="op-fade">
        {tab === "guess" && <GuessTab me={me} data={data} send={send}/>}
        {tab === "ideas" && <IdeasTab me={me} data={data} send={send}/>}
        {tab === "board" && <BoardTab data={data} send={send} onSentToOKR={() => setTab("okr")}/>}
        {tab === "okr" && <OKRTab data={data} send={send}/>}
        {tab === "poll" && <PollTab me={me} data={data} send={send}/>}
        {tab === "export" && <ExportTab data={data} send={send}/>}
      </div>
    </div>
  );
}

// ---------- ideas ----------
function IdeasTab({ me, data, send }) {
  const [text, setText] = useState("");
  const inputRef = useRef(null);

  const submit = () => {
    if (!text.trim()) return;
    const idea = { id: uid(), text: text.trim(), authorId: me.id, authorName: me.name,
      authorEmoji: me.emoji, cluster: null, kr: "", ts: Date.now() };
    setText("");
    inputRef.current?.focus();
    send("addIdea", idea, d => ({ ...d, ideas: [...d.ideas, idea] }));
  };

  const ideas = [...data.ideas].sort((a, b) => b.ts - a.ts);

  return (
    <div>
      <div className="bg-white rounded-2xl border border-[#F0EAE0] p-3 mb-5 flex gap-2" style={{ boxShadow: SHADOW_SM }}>
        <input ref={inputRef} value={text} onChange={e => setText(e.target.value)}
          onKeyDown={e => e.key === "Enter" && submit()} placeholder="Санаагаа энд бичээрэй..."
          className="flex-1 min-w-0 outline-none text-[15px] px-2"/>
        <button onClick={submit} disabled={!text.trim()}
          className="rounded-xl px-4 py-2 font-bold text-white disabled:opacity-40 shrink-0 hover:brightness-105 active:scale-[.98] transition"
          style={{ background: CORAL }}>Нэмэх</button>
      </div>
      <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3 items-start">
        {ideas.map(i => (
          <div key={i.id} className="bg-white rounded-2xl border border-[#F0EAE0] p-4 op-card overflow-hidden" style={{ boxShadow: SHADOW_SM }}>
            <p className="text-[15px] leading-snug wrap-any">{i.text}</p>
            <div className="mt-3 flex items-center gap-1.5 text-xs text-[#B0A6C0] wrap-any">
              <span>{i.authorEmoji}</span> {i.authorName}
            </div>
          </div>
        ))}
        {ideas.length === 0 && <div className="col-span-full text-center text-[#B0A6C0] py-12">Одоогоор санаа алга — эхнийхийг бичээрэй 🌱</div>}
      </div>
    </div>
  );
}

// ---------- cluster board ----------
function BoardTab({ data, send, onSentToOKR }) {
  const [newCluster, setNewCluster] = useState("");
  const [picked, setPicked] = useState(null); // tap-to-move, works on phones

  const { ideas, clusters } = data;

  const addCluster = () => {
    if (!newCluster.trim()) return;
    const c = { id: uid(), name: newCluster.trim(), color: CLUSTER_COLORS[clusters.length % CLUSTER_COLORS.length],
      sentToOKR: false, objectiveName: "", ts: Date.now() };
    setNewCluster("");
    send("addCluster", c, d => ({ ...d, clusters: [...d.clusters, c] }));
  };

  const assign = (ideaId, clusterId) => {
    setPicked(null);
    send("updateIdea", { id: ideaId, cluster: clusterId || "" },
      d => ({ ...d, ideas: d.ideas.map(i => i.id === ideaId ? { ...i, cluster: clusterId } : i) }));
  };

  const removeCluster = (id) =>
    send("deleteCluster", { id }, d => ({
      ...d, clusters: d.clusters.filter(c => c.id !== id),
      ideas: d.ideas.map(i => i.cluster === id ? { ...i, cluster: null } : i),
    }));

  const sendToOKR = (id) => {
    send("updateCluster", { id, sentToOKR: true },
      d => ({ ...d, clusters: d.clusters.map(c => c.id === id ? { ...c, sentToOKR: true } : c) }));
    onSentToOKR();
  };

  const sendAll = () => {
    send("sendAllToOKR", {}, d => ({ ...d, clusters: d.clusters.map(c => ({ ...c, sentToOKR: true })) }));
    onSentToOKR();
  };

  const unclustered = ideas.filter(i => !i.cluster);

  return (
    <div>
      <div className="flex flex-wrap gap-2 mb-4">
        <input value={newCluster} onChange={e => setNewCluster(e.target.value)} onKeyDown={e => e.key === "Enter" && addCluster()}
          placeholder="Шинэ Objective-ийн нэр"
          className="flex-1 min-w-[180px] rounded-xl border-2 border-[#F0EAE0] px-4 py-2 outline-none focus:border-[#FF6F61] text-sm"/>
        <button onClick={addCluster} className="rounded-xl px-4 py-2 font-bold text-white shrink-0" style={{ background: "#6FCF97" }}>+ Ангилал</button>
        {clusters.length > 0 && (
          <button onClick={sendAll} className="rounded-xl px-4 py-2 font-bold text-white shrink-0 whitespace-nowrap" style={{ background: "#9B8CFF" }}>🎯 Бүгдийг OKR болгох</button>
        )}
      </div>

      <p className="text-xs text-[#B0A6C0] mb-3 font-bold">
        {picked ? "Одоо доорх ангиллын аль нэгийг дарж байрлуулаарай." : "Картыг дарж сонгоод ангилал дээр дарна (утсанд), эсвэл чирж оруулна (компьютерт)."}
      </p>

      <div onDragOver={e => e.preventDefault()} onDrop={e => { const id = e.dataTransfer.getData("id"); if (id) assign(id, null); }}
        className="flex flex-wrap gap-2 bg-white rounded-2xl border-2 border-dashed border-[#F0EAE0] p-4 mb-6 min-h-[80px]">
        {unclustered.length === 0 && <span className="text-sm text-[#B0A6C0]">Бүх санаа ангилалд орлоо 🎉</span>}
        {unclustered.map(i => <Chip key={i.id} idea={i} picked={picked === i.id} onPick={() => setPicked(picked === i.id ? null : i.id)}/>)}
      </div>

      <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-4 items-start">
        {[...clusters].sort((a,b) => (a.ts||0)-(b.ts||0)).map(c => (
          <div key={c.id}
            onDragOver={e => e.preventDefault()}
            onDrop={e => { const id = e.dataTransfer.getData("id"); if (id) assign(id, c.id); }}
            onClick={() => picked && assign(picked, c.id)}
            className={`rounded-2xl p-4 min-h-[140px] overflow-hidden ${picked ? "ring-2 ring-[#FF6F61] cursor-pointer" : ""}`}
            style={{ background: c.color, boxShadow: SHADOW_SM }}>
            <div className="flex items-start justify-between mb-2 gap-2">
              <span className="font-bold text-sm wrap-any min-w-0">{c.name}{c.sentToOKR && <span className="ml-1.5 text-[10px] text-[#7A5CFF]">✓ OKR</span>}</span>
              <button onClick={e => { e.stopPropagation(); removeCluster(c.id); }} className="text-[#7A6F8A] hover:text-[#FF6F61] shrink-0">✕</button>
            </div>
            <div className="flex flex-wrap gap-2 mb-3">
              {ideas.filter(i => i.cluster === c.id).map(i =>
                <Chip key={i.id} idea={i} picked={picked === i.id} onPick={() => setPicked(picked === i.id ? null : i.id)}/>)}
            </div>
            {!c.sentToOKR && (
              <button onClick={e => { e.stopPropagation(); sendToOKR(c.id); }}
                className="text-xs font-bold bg-white/70 hover:bg-white rounded-lg px-2.5 py-1.5 text-[#7A6F8A]">🎯 OKR болгох →</button>
            )}
          </div>
        ))}
        {clusters.length === 0 && <div className="text-[#B0A6C0] text-sm">Дээрээс эхний ангиллаа үүсгээрэй ☝️</div>}
      </div>
    </div>
  );
}

function Chip({ idea, picked, onPick }) {
  return (
    <div draggable onDragStart={e => e.dataTransfer.setData("id", idea.id)}
      onClick={e => { e.stopPropagation(); onPick(); }}
      className={`bg-white rounded-xl px-3 py-2 text-sm border cursor-pointer max-w-full sm:max-w-[220px] overflow-hidden ${picked ? "border-[#FF6F61] ring-2 ring-[#FFD1CB]" : "border-[#F0EAE0]"}`}
      style={{ boxShadow: SHADOW_SM }}>
      <div className="wrap-any">{idea.text}</div>
      <div className="text-[10px] text-[#B0A6C0] mt-1 wrap-any">{idea.authorEmoji} {idea.authorName}</div>
    </div>
  );
}

// ---------- OKR ----------
function OKRTab({ data, send }) {
  const [drafts, setDrafts] = useState({});
  const { ideas, clusters } = data;
  const okrClusters = clusters.filter(c => c.sentToOKR);

  const saveObjective = (id, value) =>
    send("updateCluster", { id, objectiveName: value },
      d => ({ ...d, clusters: d.clusters.map(c => c.id === id ? { ...c, objectiveName: value } : c) }));

  const saveKR = (id, value) =>
    send("updateIdea", { id, kr: value },
      d => ({ ...d, ideas: d.ideas.map(i => i.id === id ? { ...i, kr: value } : i) }));

  if (okrClusters.length === 0) return (
    <div className="text-center text-[#B0A6C0] py-16 text-sm max-w-md mx-auto">
      Одоогоор OKR-руу шилжүүлсэн ангилал алга.<br/>"Cluster field" таб дээр ангиллаа бэлдээд <b>"OKR болгох"</b> дарна уу.
    </div>
  );

  return (
    <div className="space-y-5">
      <p className="text-xs text-[#B0A6C0] uppercase font-bold tracking-wide">Ангилал бүр нэг Objective. Асуудал бүрт Key Result бичээрэй.</p>
      {okrClusters.map(c => {
        const cIdeas = ideas.filter(i => i.cluster === c.id);
        const ok = `obj-${c.id}`;
        return (
          <div key={c.id} className="rounded-[26px] p-5 border border-[#F0EAE0] bg-white overflow-hidden" style={{ boxShadow: SHADOW_SM }}>
            <div className="flex items-center gap-2 mb-3">
              <span className="text-[#9B8CFF] shrink-0">🎯</span>
              <input value={drafts[ok] ?? c.objectiveName ?? ""}
                onChange={e => setDrafts(d => ({ ...d, [ok]: e.target.value }))}
                onBlur={e => saveObjective(c.id, e.target.value)}
                placeholder={`Objective нэр (санал: "${c.name}")`}
                className="flex-1 min-w-0 font-extrabold text-[15px] outline-none border-b-2 border-[#F0EAE0] focus:border-[#9B8CFF] py-1 bg-transparent"/>
            </div>
            <div className="space-y-2 sm:ml-6">
              {cIdeas.length === 0 && <p className="text-xs text-[#B0A6C0]">Энэ ангилалд асуудал алга.</p>}
              {cIdeas.map((idea, idx) => {
                const kk = `kr-${idea.id}`;
                return (
                  <div key={idea.id} className="flex items-start gap-2 bg-[#FAF7F2] rounded-xl p-3">
                    <span className="text-[10px] font-bold text-[#B0A6C0] mt-2 shrink-0">KR{idx+1}</span>
                    <div className="flex-1 min-w-0">
                      <p className="text-sm mb-1.5 wrap-any">{idea.text}</p>
                      <input value={drafts[kk] ?? idea.kr ?? ""}
                        onChange={e => setDrafts(d => ({ ...d, [kk]: e.target.value }))}
                        onBlur={e => saveKR(idea.id, e.target.value)}
                        placeholder="Key Result бичих..."
                        className="w-full text-sm outline-none border-b border-[#E5DFCF] focus:border-[#9B8CFF] py-1 bg-transparent"/>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        );
      })}
    </div>
  );
}

// ---------- guess who: one deck, no repeats ----------
function GuessTab({ me, data, send }) {
  const [used, setUsed] = useState([]);
  const [current, setCurrent] = useState(null);
  const [result, setResult] = useState(null);
  const [score, setScore] = useState({ correct: 0, total: 0 });
  const [showBoard, setShowBoard] = useState(false);

  const deck = data.participants.filter(p => p.id !== me.id)
    .flatMap(p => (p.traits || []).map((t, i) => ({ id: `${p.id}-${i}`, text: t, ownerId: p.id, ownerName: p.name, ownerEmoji: p.emoji })));

  const draw = (usedIds) => {
    const left = deck.filter(c => !usedIds.includes(c.id));
    if (!left.length) { setCurrent(null); return; }
    const pick = left[Math.floor(Math.random() * left.length)];
    setCurrent(pick); setResult(null); setUsed([...usedIds, pick.id]);
  };

  useEffect(() => { if (!current && used.length === 0 && deck.length) draw([]); }, [data.participants.length]); // eslint-disable-line

  const guess = (p) => {
    const correct = p.id === current.ownerId;
    setResult({ correct });
    const next = { correct: score.correct + (correct?1:0), total: score.total + 1 };
    setScore(next);
    send("setScore", { userId: me.id, name: me.name, emoji: me.emoji, correct: next.correct, total: next.total });
  };

  if (data.participants.length < 2)
    return <div className="text-center text-[#B0A6C0] py-16">Тоглохын тулд дор хаяж 2 оролцогч хэрэгтэй 🙂</div>;

  const ranked = [...data.scores].sort((a,b) => b.correct - a.correct || b.total - a.total);
  const finished = deck.length > 0 && !current && used.length > 0;

  const header = (
    <div className="flex items-center justify-center gap-3 text-xs font-bold text-[#B0A6C0] mb-4 uppercase tracking-wide">
      <span>🏆 Миний оноо: {score.correct}/{score.total}</span>
      <button onClick={() => setShowBoard(s => !s)} className="text-[#5FB4E5] hover:underline normal-case font-bold">
        {showBoard ? "Тэргүүлэгчдийг нуух" : "Тэргүүлэгчдийг харах"}
      </button>
    </div>
  );

  const board = showBoard && (
    <div className="bg-white rounded-[26px] border border-[#F0EAE0] p-5 mb-5 text-left op-fade" style={{ boxShadow: SHADOW_SM }}>
      <h4 className="font-extrabold text-sm mb-3">🏆 Тэргүүлэгчдийн самбар</h4>
      {ranked.length === 0 ? <p className="text-xs text-[#B0A6C0]">Одоогоор оноо алга.</p> : (
        <div className="space-y-1.5">
          {ranked.map((r, i) => (
            <div key={r.userId || i} className="flex items-center justify-between text-sm bg-[#FAF7F2] rounded-xl px-3 py-2 gap-2">
              <span className="flex items-center gap-2 min-w-0"><span className="text-[10px] font-bold text-[#B0A6C0] w-4">{i+1}</span><span>{r.emoji}</span><span className="truncate">{r.name}</span></span>
              <span className="font-bold text-[#7A6F8A] shrink-0">{r.correct}/{r.total}</span>
            </div>
          ))}
        </div>
      )}
    </div>
  );

  if (finished) return (
    <div className="max-w-lg mx-auto text-center">{header}{board}
      <div className="bg-white rounded-[28px] border border-[#F0EAE0] p-8 op-fade" style={{ boxShadow: SHADOW }}>
        <div className="text-5xl mb-3">🎉</div>
        <h3 className="font-extrabold text-lg mb-2">Бүх мэдээлэл дууслаа!</h3>
        <p className="text-sm text-[#7A6F8A] mb-6">Таны оноо: <b>{score.correct}/{score.total}</b></p>
        <button onClick={() => { setUsed([]); setScore({correct:0,total:0}); draw([]); }}
          className="rounded-xl px-5 py-2.5 font-bold text-white mx-auto" style={{ background: CORAL }}>Дахин эхлүүлэх</button>
      </div>
    </div>
  );

  if (!current) return <div className="text-center text-[#B0A6C0] py-16">Мэдээлэл ачаалж байна...</div>;

  return (
    <div className="max-w-lg mx-auto text-center">{header}{board}
      <div className="bg-white rounded-[28px] border border-[#F0EAE0] p-8 overflow-hidden" style={{ boxShadow: SHADOW }}>
        <div className="text-5xl mb-3">🕵️</div>
        <div className="text-[11px] font-bold uppercase tracking-wide text-[#B0A6C0] mb-3">Мэдээлэл {used.length} / {deck.length}</div>
        <div className="h-1.5 bg-[#F0EAE0] rounded-full mb-5 overflow-hidden">
          <div className="h-full rounded-full transition-all duration-500" style={{ width: `${(used.length/Math.max(deck.length,1))*100}%`, background: CORAL }}/>
        </div>
        <h3 className="font-extrabold text-lg mb-4">Энэ мэдээлэл хэнийх вэ?</h3>
        <div className="bg-[#FAF7F2] rounded-xl px-4 py-3 text-[15px] font-semibold mb-5 wrap-any">"{current.text}"</div>
        {!result ? (
          <div className="grid grid-cols-2 gap-2">
            {data.participants.filter(p => p.id !== me.id).map(p => (
              <button key={p.id} onClick={() => guess(p)}
                className="flex items-center gap-2 bg-white border-2 border-[#F0EAE0] hover:border-[#FF6F61] rounded-xl px-3 py-2 text-sm font-semibold min-w-0">
                <span className="text-lg shrink-0">{p.emoji}</span><span className="truncate">{p.name}</span>
              </button>
            ))}
          </div>
        ) : (
          <div className="op-fade">
            <div className={`rounded-2xl p-4 mb-4 font-bold wrap-any ${result.correct ? "bg-[#E4F7E9] text-[#2C8C5A]" : "bg-[#FFE3DA] text-[#C6503D]"}`}>
              {result.correct ? "✓ Зөв!" : `✕ Буруу — энэ бол ${current.ownerEmoji} ${current.ownerName} байлаа`}
            </div>
            <button onClick={() => draw(used)} className="rounded-xl px-5 py-2.5 font-bold text-white mx-auto" style={{ background: CORAL }}>Дараагийн мэдээлэл →</button>
          </div>
        )}
      </div>
      <p className="text-xs text-[#B0A6C0] mt-4">💡 Мэдээлэл бүр нэг л удаа гарна — давтагдахгүй.</p>
    </div>
  );
}

// ---------- poll ----------
function PollTab({ me, data, send }) {
  const [question, setQuestion] = useState("");
  const poll = data.poll;

  const create = () => {
    if (!question.trim()) return;
    const p = { id: uid(), question: question.trim(), createdBy: me.name, ts: Date.now() };
    setQuestion("");
    send("setPoll", p, d => ({ ...d, poll: p, votes: [] }));
  };

  const vote = (emoji) => send("vote", { userId: me.id, pollId: poll.id, emoji },
    d => ({ ...d, votes: [...d.votes.filter(v => v.userId !== me.id), { userId: me.id, pollId: poll.id, emoji }] }));

  const active = data.votes.filter(v => poll && v.pollId === poll.id);
  const counts = {}; REACTIONS.forEach(r => counts[r] = 0);
  active.forEach(v => counts[v.emoji] = (counts[v.emoji] || 0) + 1);
  const mine = active.find(v => v.userId === me.id)?.emoji;

  return (
    <div className="max-w-lg mx-auto">
      <div className="bg-white rounded-[26px] border border-[#F0EAE0] p-6 mb-5" style={{ boxShadow: SHADOW_SM }}>
        <label className="text-xs font-bold uppercase tracking-wide text-[#B0A6C0]">Шинэ түргэн санал асуулга</label>
        <div className="flex gap-2 mt-2">
          <input value={question} onChange={e => setQuestion(e.target.value)} onKeyDown={e => e.key === "Enter" && create()}
            placeholder="Асуултаа бичээд Enter дар..."
            className="flex-1 min-w-0 rounded-xl border-2 border-[#F0EAE0] px-3 py-2 text-sm outline-none focus:border-[#FF6F61]"/>
          <button onClick={create} disabled={!question.trim()} className="rounded-xl px-4 py-2 font-bold text-white disabled:opacity-40 shrink-0" style={{ background: "#5FB4E5" }}>Эхлүүлэх</button>
        </div>
      </div>
      {poll ? (
        <div className="bg-white rounded-[28px] border border-[#F0EAE0] p-8 text-center op-fade overflow-hidden" style={{ boxShadow: SHADOW }}>
          <p className="text-[11px] text-[#B0A6C0] uppercase font-bold mb-1">{poll.createdBy}-с</p>
          <h3 className="font-extrabold text-lg mb-6 wrap-any">{poll.question}</h3>
          <div className="flex justify-center gap-2 mb-6 flex-wrap">
            {REACTIONS.map(r => (
              <button key={r} onClick={() => vote(r)}
                className={`flex flex-col items-center gap-1 rounded-2xl px-4 py-3 border-2 ${mine === r ? "border-[#FF6F61] bg-[#FFF1EE]" : "border-[#F0EAE0] hover:border-[#FFD1CB]"}`}>
                <span className="text-2xl">{r}</span><span className="text-xs font-bold text-[#B0A6C0]">{counts[r]}</span>
              </button>
            ))}
          </div>
          <p className="text-xs text-[#B0A6C0] mb-4">Нийт санал өгсөн: {active.length}</p>
          <button onClick={() => send("clearPoll", {}, d => ({ ...d, poll: null, votes: [] }))} className="text-xs font-bold text-[#B0A6C0] hover:text-[#FF6F61]">Санал асуулгыг хаах</button>
        </div>
      ) : <div className="text-center text-[#B0A6C0] py-10 text-sm">Одоогоор идэвхтэй санал асуулга алга ☝️</div>}
    </div>
  );
}

// ---------- export ----------
function ExportTab({ data, send }) {
  const [confirming, setConfirming] = useState(false);
  const { ideas, clusters, participants } = data;

  const exportExcel = () => {
    const cname = id => clusters.find(c => c.id === id)?.name || "Ангилаагүй";
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(ideas.map(i => ({
      Асуудал: i.text, Санал_гаргагч: i.authorName, Ангилал: cname(i.cluster),
      Key_Result: i.kr || "", Огноо: new Date(i.ts).toLocaleString(),
    }))), "Асуудлууд");
    const counts = {};
    ideas.forEach(i => { const n = cname(i.cluster); counts[n] = (counts[n]||0)+1; });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(Object.entries(counts).map(([Ангилал, Тоо]) => ({ Ангилал, Тоо }))), "Ангиллын товч");
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(participants.map(p => ({
      Нэр: p.name, Аватар: p.emoji, Мэдээллүүд: (p.traits||[]).join(" | "),
      Асуудлын_тоо: ideas.filter(i => i.authorId === p.id).length,
    }))), "Оролцогчид");
    const okr = [];
    clusters.filter(c => c.sentToOKR).forEach(c =>
      ideas.filter(i => i.cluster === c.id).forEach((idea, idx) =>
        okr.push({ Objective: c.objectiveName || c.name, KR: `KR${idx+1}`, Асуудал: idea.text, Key_Result: idea.kr || "", Санал_гаргагч: idea.authorName })));
    if (okr.length) XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(okr), "OKR");
    XLSX.writeFile(wb, `okr-party-q3-${new Date().toISOString().slice(0,10)}.xlsx`);
  };

  return (
    <div className="max-w-lg mx-auto text-center bg-white rounded-[28px] border border-[#F0EAE0] p-8" style={{ boxShadow: SHADOW }}>
      <div className="text-5xl mb-3">📊</div>
      <h3 className="font-extrabold text-lg mb-2">Уулзалтын мэдээллийг татах</h3>
      <p className="text-sm text-[#7A6F8A] mb-6">Бүх мэдээлэл Google Sheet дээр шууд хадгалагдаж байгаа. Эндээс Excel хэлбэрээр татаж авах боломжтой.</p>
      <div className="grid grid-cols-3 gap-3 mb-6 text-sm">
        <Stat label="Санаа" value={ideas.length}/><Stat label="Ангилал" value={clusters.length}/><Stat label="Хүн" value={participants.length}/>
      </div>
      <button onClick={exportExcel} className="rounded-xl px-6 py-3 font-bold text-white mx-auto" style={{ background: CORAL }}>⬇ Excel татах (.xlsx)</button>
      <div className="mt-8 pt-6 border-t border-[#F0EAE0]">
        {!confirming ? (
          <button onClick={() => setConfirming(true)} className="text-xs font-bold text-[#B0A6C0] hover:text-[#FF6F61]">Бүх мэдээллийг цэвэрлэх (шинэ уулзалт)</button>
        ) : (
          <div className="bg-[#FFE3DA] rounded-2xl p-4">
            <p className="text-sm font-bold text-[#C6503D] mb-3">Бүх мэдээлэл устана. Excel-ээр татаж авсан эсэхээ шалгаарай!</p>
            <div className="flex gap-2 justify-center">
              <button onClick={() => { send("reset", {}); localStorage.removeItem("okrparty_me"); setTimeout(() => location.reload(), 600); }}
                className="rounded-xl px-4 py-2 font-bold text-white text-sm" style={{ background: "#C6503D" }}>Тийм, устга</button>
              <button onClick={() => setConfirming(false)} className="rounded-xl px-4 py-2 font-bold text-sm text-[#7A6F8A] bg-white">Цуцлах</button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

function Stat({ label, value }) {
  return <div className="bg-[#FAF7F2] rounded-xl py-3"><div className="font-extrabold text-xl">{value}</div><div className="text-[10px] uppercase text-[#B0A6C0] font-bold">{label}</div></div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
